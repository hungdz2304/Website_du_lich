<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý Bookings - Admin</title>
    <link rel="stylesheet" href="../../assets/css/style.css">
    <link rel="stylesheet" href="../../assets/css/admin.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="admin-layout">
        <aside class="admin-sidebar">
            <div class="admin-logo">
                <i class="fas fa-plane-departure"></i>
                <span>Admin Panel</span>
            </div>
            <nav class="admin-nav">
                <a href="index.html">
                    <i class="fas fa-tachometer-alt"></i> Dashboard
                </a>
                <a href="tours.html">
                    <i class="fas fa-map-marked-alt"></i> Quản lý Tours
                </a>
                <a href="bookings.html" class="active">
                    <i class="fas fa-ticket-alt"></i> Quản lý Bookings
                </a>
                <a href="users.html">
                    <i class="fas fa-users"></i> Quản lý Users
                </a>
                <a href="reviews.html">
                    <i class="fas fa-star"></i> Quản lý Reviews
                </a>
                <a href="../index.html">
                    <i class="fas fa-globe"></i> Về Website
                </a>
            </nav>
            <div class="admin-user">
                <i class="fas fa-user-shield"></i>
                <div>
                    <strong id="adminName">Admin</strong>
                    <small id="adminEmail">admin@toursite.com</small>
                </div>
            </div>
        </aside>

        <main class="admin-main">
            <header class="admin-header">
                <h1>Quản lý Bookings</h1>
                <button id="btnLogout" class="btn-logout">
                    <i class="fas fa-sign-out-alt"></i> Đăng xuất
                </button>
            </header>

            <div class="admin-section">
                <!-- Search & Filter Bar -->
                <div class="admin-toolbar">
                    <div class="search-box">
                        <i class="fas fa-search"></i>
                        <input type="text" id="searchBooking" placeholder="Tìm mã booking, tên khách, email, SĐT...">
                        <button type="button" id="btnClearSearch" class="btn-clear" style="display:none;">
                            <i class="fas fa-times"></i>
                        </button>
                    </div>
                    <div class="filter-group">
                        <select id="filterStatus">
                            <option value="">Tất cả trạng thái</option>
                            <option value="pending">Chờ xác nhận</option>
                            <option value="confirmed">Đã xác nhận</option>
                            <option value="completed">Hoàn thành</option>
                            <option value="cancelled">Đã hủy</option>
                        </select>
                        <select id="filterPayment">
                            <option value="">Tất cả thanh toán</option>
                            <option value="pending">Chưa thanh toán</option>
                            <option value="paid">Đã thanh toán</option>
                            <option value="refunded">Đã hoàn tiền</option>
                        </select>
                    </div>
                    <div class="toolbar-stats">
                        <span id="resultCount">0 kết quả</span>
                    </div>
                </div>

                <div class="table-container">
                    <table class="admin-table">
                        <thead>
                            <tr>
                                <th>Mã Booking</th>
                                <th>Khách Hàng</th>
                                <th>Tour</th>
                                <th>Ngày Khởi Hành</th>
                                <th>Số Người</th>
                                <th>Tổng Tiền</th>
                                <th>Trạng Thái</th>
                                <th>Thanh Toán</th>
                                <th>Ngày Đặt</th>
                                <th>Thao Tác</th>
                            </tr>
                        </thead>
                        <tbody id="bookingsTable">
                            <tr>
                                <td colspan="10" class="text-center">Đang tải...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <!-- Booking Detail Modal -->
    <div class="modal-overlay" id="bookingDetailModal" style="display:none;">
        <div class="modal-content modal-lg">
            <div class="modal-header">
                <h2><i class="fas fa-ticket-alt"></i> Chi tiết Booking</h2>
                <button class="modal-close" id="closeBookingModal">&times;</button>
            </div>
            <div class="modal-body" id="bookingDetailContent">
                <!-- Content loaded dynamically -->
            </div>
        </div>
    </div>

    <script src="../../assets/js/main.js"></script>
    <script>
        (function() {
            const { apiRequest, formatPrice, formatDate, formatDateTime, isLoggedIn, getUserData, logout } = window.TourBooking || {};

        let allBookings = [];

        function checkAdminAccess() {
            if (!isLoggedIn()) {
                window.location.href = '../login.html';
                return false;
            }
            const user = getUserData();
            if (user.role !== 'admin') {
                alert('Bạn không có quyền truy cập');
                window.location.href = '../index.html';
                return false;
            }
            document.getElementById('adminName').textContent = user.full_name || 'Admin';
            document.getElementById('adminEmail').textContent = user.email;
            return true;
        }

        async function loadBookings() {
            try {
                const res = await apiRequest('/admin/bookings?limit=100');
                if (res.success) {
                    allBookings = res.data.bookings;
                    applyFilters();
                }
            } catch (error) {
                console.error('Load bookings error:', error);
                document.getElementById('bookingsTable').innerHTML = '<tr><td colspan="10" class="text-center">Lỗi tải dữ liệu</td></tr>';
            }
        }

        function applyFilters() {
            const searchTerm = document.getElementById('searchBooking').value.toLowerCase().trim();
            const statusFilter = document.getElementById('filterStatus').value;
            const paymentFilter = document.getElementById('filterPayment').value;

            let filtered = allBookings;

            // Search filter
            if (searchTerm) {
                filtered = filtered.filter(b => 
                    b.booking_reference?.toLowerCase().includes(searchTerm) ||
                    b.customer_name?.toLowerCase().includes(searchTerm) ||
                    b.customer_email?.toLowerCase().includes(searchTerm) ||
                    b.contact_phone?.toLowerCase().includes(searchTerm) ||
                    b.tour_title?.toLowerCase().includes(searchTerm)
                );
            }

            // Status filter
            if (statusFilter) {
                filtered = filtered.filter(b => b.status === statusFilter);
            }

            // Payment filter
            if (paymentFilter) {
                filtered = filtered.filter(b => b.payment_status === paymentFilter);
            }

            renderBookings(filtered);
            document.getElementById('resultCount').textContent = `${filtered.length} kết quả`;

            // Show/hide clear button
            const clearBtn = document.getElementById('btnClearSearch');
            clearBtn.style.display = searchTerm ? 'block' : 'none';
        }

        function renderBookings(bookings) {
            const tbody = document.getElementById('bookingsTable');
            if (bookings.length === 0) {
                tbody.innerHTML = '<tr><td colspan="10" class="text-center">Không tìm thấy booking nào</td></tr>';
                return;
            }

            tbody.innerHTML = bookings.map(booking => {
                const departureDate = booking.departure_date ? formatDate(booking.departure_date) : '-';
                const bookingDate = booking.booking_date ? formatDate(booking.booking_date) : '-';
                return `
                <tr>
                    <td><strong class="booking-ref">${booking.booking_reference}</strong></td>
                    <td>
                        ${booking.customer_name}<br>
                        <small>${booking.customer_email}</small>
                    </td>
                    <td>${booking.tour_title}</td>
                    <td>${departureDate}</td>
                    <td>
                        ${booking.num_adults}A
                        ${booking.num_children > 0 ? `, ${booking.num_children}C` : ''}
                        ${booking.num_infants > 0 ? `, ${booking.num_infants}I` : ''}
                    </td>
                    <td>${formatPrice(booking.final_price)}</td>
                    <td><span class="status-badge status-${booking.status}">${getStatusLabel(booking.status)}</span></td>
                    <td><span class="payment-badge payment-${booking.payment_status}">${getPaymentLabel(booking.payment_status)}</span></td>
                    <td>${bookingDate}</td>
                    <td>
                        <button class="btn-action btn-view" onclick="viewBooking(${booking.booking_id})" title="Xem chi tiết">
                            <i class="fas fa-eye"></i>
                        </button>
                    </td>
                </tr>
                `;
            }).join('');
        }

        function getStatusLabel(status) {
            const labels = {
                pending: 'Chờ xác nhận',
                confirmed: 'Đã xác nhận',
                completed: 'Hoàn thành',
                cancelled: 'Đã hủy'
            };
            return labels[status] || status;
        }

        function getPaymentLabel(status) {
            const labels = {
                pending: 'Chưa TT',
                paid: 'Đã TT',
                partial: 'TT một phần',
                refunded: 'Hoàn tiền'
            };
            return labels[status] || status;
        }

        // View booking detail
        window.viewBooking = async function(bookingId) {
            const booking = allBookings.find(b => b.booking_id === bookingId);
            if (!booking) return;

            const modal = document.getElementById('bookingDetailModal');
            const content = document.getElementById('bookingDetailContent');

            content.innerHTML = `
                <div class="booking-detail">
                    <div class="detail-section">
                        <h3><i class="fas fa-info-circle"></i> Thông tin chung</h3>
                        <div class="detail-grid">
                            <div class="detail-item">
                                <span class="label">Mã Booking:</span>
                                <strong class="value">${booking.booking_reference}</strong>
                            </div>
                            <div class="detail-item">
                                <span class="label">Trạng thái:</span>
                                <span class="status-badge status-${booking.status}">${getStatusLabel(booking.status)}</span>
                            </div>
                            <div class="detail-item">
                                <span class="label">Ngày đặt:</span>
                                <span class="value">${formatDateTime ? formatDateTime(booking.booking_date) : formatDate(booking.booking_date)}</span>
                            </div>
                        </div>
                    </div>

                    <div class="detail-section">
                        <h3><i class="fas fa-user"></i> Thông tin khách hàng</h3>
                        <div class="detail-grid">
                            <div class="detail-item">
                                <span class="label">Họ tên:</span>
                                <span class="value">${booking.customer_name}</span>
                            </div>
                            <div class="detail-item">
                                <span class="label">Email:</span>
                                <span class="value">${booking.customer_email}</span>
                            </div>
                            <div class="detail-item">
                                <span class="label">Điện thoại:</span>
                                <span class="value">${booking.contact_phone || '-'}</span>
                            </div>
                        </div>
                    </div>

                    <div class="detail-section">
                        <h3><i class="fas fa-map-marked-alt"></i> Thông tin tour</h3>
                        <div class="detail-grid">
                            <div class="detail-item full">
                                <span class="label">Tour:</span>
                                <span class="value">${booking.tour_title}</span>
                            </div>
                            <div class="detail-item">
                                <span class="label">Ngày khởi hành:</span>
                                <span class="value">${booking.departure_date ? formatDate(booking.departure_date) : 'Chưa xác định'}</span>
                            </div>
                            <div class="detail-item">
                                <span class="label">Số người:</span>
                                <span class="value">${booking.num_adults} NL, ${booking.num_children || 0} TE, ${booking.num_infants || 0} EB</span>
                            </div>
                        </div>
                    </div>

                    <div class="detail-section">
                        <h3><i class="fas fa-credit-card"></i> Thanh toán</h3>
                        <div class="detail-grid">
                            <div class="detail-item">
                                <span class="label">Tổng tiền:</span>
                                <strong class="value price">${formatPrice(booking.final_price)}</strong>
                            </div>
                            <div class="detail-item">
                                <span class="label">Phương thức:</span>
                                <span class="value">${booking.payment_method || '-'}</span>
                            </div>
                            <div class="detail-item">
                                <span class="label">Trạng thái TT:</span>
                                <span class="payment-badge payment-${booking.payment_status}">${getPaymentLabel(booking.payment_status)}</span>
                            </div>
                        </div>
                    </div>

                    ${booking.special_requests ? `
                    <div class="detail-section">
                        <h3><i class="fas fa-comment-alt"></i> Yêu cầu đặc biệt</h3>
                        <p class="special-requests">${booking.special_requests}</p>
                    </div>
                    ` : ''}
                </div>
            `;

            modal.style.display = 'flex';
        }

        // Close modal
        document.getElementById('closeBookingModal')?.addEventListener('click', () => {
            document.getElementById('bookingDetailModal').style.display = 'none';
        });

        document.getElementById('bookingDetailModal')?.addEventListener('click', (e) => {
            if (e.target.id === 'bookingDetailModal') {
                e.target.style.display = 'none';
            }
        });

        // Event listeners for search and filter
        document.getElementById('searchBooking')?.addEventListener('input', debounce(applyFilters, 300));
        document.getElementById('filterStatus')?.addEventListener('change', applyFilters);
        document.getElementById('filterPayment')?.addEventListener('change', applyFilters);
        document.getElementById('btnClearSearch')?.addEventListener('click', () => {
            document.getElementById('searchBooking').value = '';
            applyFilters();
        });

        // Debounce helper
        function debounce(func, wait) {
            let timeout;
            return function(...args) {
                clearTimeout(timeout);
                timeout = setTimeout(() => func.apply(this, args), wait);
            };
        }

        document.getElementById('btnLogout')?.addEventListener('click', () => {
            if (confirm('Bạn có chắc muốn đăng xuất?')) logout();
        });

            document.addEventListener('DOMContentLoaded', () => {
                if (checkAdminAccess()) loadBookings();
            });
        })();
    </script>
